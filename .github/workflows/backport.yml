name: PHP Backport

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  schedule:
    - cron: "0 0 * * 0" # every week

jobs:
  build:
    uses: ./.github/workflows/docker-build.yml
    with:
      php_versions: '["5.6"]'
      flavors: '["apache"]'
      # Always rebuild from a fresh debian:bookworm-slim. With the layer
      # cache, the weekly build reused the old apt layers and never picked
      # up Debian security updates.
      no_cache: true
    secrets: inherit
